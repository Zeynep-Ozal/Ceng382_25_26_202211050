<!DOCTYPE html>
<html>
<head>
    <title>Labwork 2</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:wght@400;700&display=swap" rel="stylesheet">

    <style>    
        body {
            font-family: 'Cinzel', serif; 
            text-align: center;
            margin-top: 50px;
            font-weight: 700;
            overflow: hidden;
            background-image: url('nv2.jpg');
            background-size: cover;
        }

        #bg-video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 3;
        }

        /* Kenarları üçgen olan dikdörtgen şekli nasıl çizerim */
        .custom-shape {
            position: absolute;
            top: 6%; /* Başlıkla hizalamak için bu değeri ayarlayın */
            left: 50%;
            transform: translateX(-50%);
            width: 600px; /* Genişliği ayarlayın */
            height: 75px; /* Yüksekliği ayarlayın */
            background-color: rgba(52, 152, 219, 0.5); /* Yarı saydam arkaplan */
            z-index: 1; /* h1'in arkasında kalacak */
            clip-path: polygon(
                10% 0%, /* Sol üst köşe */
                90% 0%, /* Sağ üst köşe */
                100% 50%, /* Sağ orta nokta */
                90% 100%, /* Sağ alt köşe */
                10% 100%, /* Sol alt köşe */
                0% 50% /* Sol orta nokta */
            );
        }

        h1 {
            font-family: 'Cinzel', serif; 
            font-size: 50px;
            font-weight: 1000;
            color: rgb(40, 74, 201);
            position: relative; 
            z-index: 2; /* h1 başlığını şeklin önüne getir */
            margin-top: 20px; /* Başlık ile şekil arasındaki boşluğu ayarlayın */
        }

        .box {
            width: 400px;
            height: 400px; 
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px); 
            border: 2px solid white;
            border-radius: 15px;
            padding: 20px;
            font-size: 24px;
            font-weight: 700;
            color: white;
            display: flex;
            flex-direction: column;
            margin-left: 50px;
            align-items: center;

            animation: slideInFromLeft 1s ease-out; 
            animation-delay: 3s;
        }

        input[type="text"], input[type="password"] {
            width: 80%; 
            padding: 10px;
            margin: 10px 0;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 5px;
            background-color: rgba(255, 255, 255, 0.8);
            color: #333;
            font-family: 'IM Fell English';
        }

        input[type="submit"] {
            width: 80%;
            padding: 10px;
            font-size: 16px;
            background-color: rgb(40, 74, 201);
            border: none;
            border-radius: 5px;
            color: white;
            cursor: pointer;
            font-family: 'IM Fell English';
            background-image: url('2.gif'); 
            background-size: cover; 
            background-position: center;
        }

        input[type="submit"]:hover {
            background-color: rgb(28, 56, 158);
            font-family: 'IM Fell English';
        }

        /* Star effect CSS */
        .four-point-star::after,
        .four-point-star::before {
            position: absolute;
            content: "\2726";
            font-size: 6rem;
            left: 20;

        }

        .four-point-star::after { /* The foreground star */
            background: linear-gradient(135deg, rgb(247, 244, 244) 20%, rgb(252, 251, 251) 70%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;            
        }

        .four-point-star::before { /* The star shadow */
            color: transparent;
            text-shadow: 2px 3px 10px rgb(251, 249, 249);   
        }

        .four-point-star {
            position: relative;
            transform: translateX(-40px);
        }

        #clock{
            font-size: 3rem;
            font-weight: bold;
            color: rgb(28, 56, 158);
        }

        @keyframes slideInFromLeft {
            0% {
                transform: translateX(-100%);
                opacity: 0;
            }
            100% {
                transform: translateX(0);
                opacity: 1;
            }
        }
    </style>
</head>
<body>

    <h1>Genshin Impact</h1>
    <div id="clock"></div>

    <video autoplay muted playsinline onended="this.style.display='none'" id="bg-video">
        <source src="1.mp4" type="video/mp4">
    </video>
    
    <label class="box">
        <h2>Login</h2>
        <form action="#" method="POST" onsubmit="event.preventDefault();">
            <input id="usernamebox" type="text" name="username" placeholder="user name or e-mail" required>
            <input id="passwordbox" type="password" name="password" placeholder="password" required>
            <input id="submitbox" type="submit" value="Enter">
            <div class="four-point-star"></div>

        </form>
    </label>
   
    <label class="custom-shape"></label>  
    
    <script>
        function updateClock() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
     
            document.getElementById('clock').textContent = `${hours}:${minutes}`;
        }
        setInterval(updateClock, 1000);
        updateClock();

        document.addEventListener("keydown", function(event) {
        if (event.key.toLowerCase() === "h") {
            const forms = document.querySelectorAll("form, input, button,.box,.four-point-star");
            forms.forEach(form => {
                form.style.display = form.style.display === "none" ? "block" : "none";
            });
        }
    });
    </script>
    <script src="func.js"></script>

</body>
</html>
